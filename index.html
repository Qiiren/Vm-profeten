    .header-right { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .save-status { font-size: 12px; color: #5cf07a; min-width: 16px; }
    .sync-time { font-size: 10px; color: #2a5a2a; }
    .sync-btn {
      background: #0f1f0f; border: 1px solid #1a3a1a; color: #4a8a4a;
      border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .player-badge {
      background: #0f2a14; color: #5cf07a; border-radius: 20px; padding: 3px 10px;
      font-size: 11px; font-weight: 700; border: 1px solid #2a6a2a;
    }
    .nav-btn {
      background: #0d1a0d; border: 1px solid #1a3a1a; color: #9aaa9a;
      border-radius: 8px; padding: 4px 10px; font-size: 11px; cursor: pointer;
    }
    .nav-btn.active { background: #0f2a14; color: #7afc8a; border-color: #3a7a3a; }
    .nav-btn.admin-on { background: #4a0a0a; color: #ffaaaa; border-color: #7a2a2a; }
    .nav-btn.dim { opacity: 0.4; font-size: 10px; }

    /* Content */
    .content { padding: 12px 14px; max-width: 680px; margin: 0 auto; }

    /* Today box */
    .today-box {
      background: #0a1a0a; border: 1px solid #2a5a1a; border-radius: 12px;

    }
    .today-title { font-size: 12px; color: #5a9a3a; font-weight: 700; margin-bottom: 8px; }
    .today-match {

      border-top: 1px solid #1a3a1a; font-size: 13px; cursor: pointer; flex-wrap: wrap;
    }
    .today-time {
      background: #1a3a0a; color: #7acc4a; border-radius: 6px; padding: 2px 7px;
      font-size: 11px; font-weight: 700; min-width: 38px; text-align: center;
    }
    .today-open { margin-left: auto; color: #4a8a2a; font-size: 11px; }
    .today-result { margin-left: auto; color: #7afc8a; font-weight: 700; font-size: 14px; }
    .today-live { margin-left: auto; font-size: 11px; }

    .stage-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
    .stage-tab {
      background: #0d1a0d; border: 1px solid #1a3a1a; color: #5a7a5a;
      border-radius: 8px; padding: 4px 10px; font-size: 11px; cursor: pointer;
    }
    .stage-tab.active { background: #0f2a14; color: #7afc8a; border-color: #3a7a3a; font-weight: 700; }

    .group-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
    .group-tab {
      background: #0d1a0d; border: 1px solid #1a2a1a; color: #4a7a4a;

    }
    .group-tab.active { background: #0f2a14; color: #7afc8a; border-color: #3a8a3a; }
    .group-tab.has-open { border-color: #2a5a1a; color: #7acc5a; }
    .group-header { font-size: 12px; color: #3a6a3a; margin-bottom: 8px; }

    /* Match card */
    .match-card {
      background: #0a140a; border: 1px solid #1a2a1a; border-radius: 12px;
      padding: 12px; margin-bottom: 8px;
    }
    .match-card.open { border-color: #2a5a1a; }
    .match-card.locked { border-color: #1a2a1a; opacity: 0.9; }
    .match-card.done { border-color: #2a5a2a; background: #0a180a; }

    .match-meta { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
    .match-date { font-size: 11px; color: #3a6a3a; }
    .badge { border-radius: 6px; padding: 1px 7px; font-size: 10px; }
    .badge-group { background: #0f2a0f; color: #4a8a4a; }
    .badge-open { background: #1a3a0a; color: #7acc4a; }
    .badge-live { background: #2a1a0a; color: #cc8a3a; }
    .badge-done { background: #0a2a14; color: #5aaa6a; }

    .match-teams { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

    .team-block.right { align-items: flex-end; text-align: right; }
    .flag-big { font-size: 28px; }
    .team-name { font-size: 12px; color: #9aaa9a; margin-top: 2px; }
    .score-block { flex: 0 0 70px; text-align: center; }
    .final-score { font-size: 22px; font-weight: 900; color: #7afc8a; letter-spacing: 2px; }
    .vs-label { font-size: 13px; color: #2a5a2a; font-weight: 700; }

    .tip-input-wrap { display: flex; align-items: center; gap: 6px; }
    .tip-label { font-size: 11px; color: #3a6a3a; }

      text-align: center; outline: none; -moz-appearance: textfield;

    .score-dash { color: #3a6a3a; font-weight: 700; font-size: 14px; }
    .locked-tip {

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function matchDT(m) { return new Date(`${m.date}T${m.time}:00+02:00`); }
function isLocked(m) { return new Date() >= matchDT(m); }
function fmtDate(m) {
  return matchDT(m).toLocaleDateString("nb-NO",{weekday:"short",day:"numeric",month:"short"}) + " " + m.time;
}
function calcPts(tip, res) {
  if (!tip || !res) return 0;
  const th=parseInt(tip.home),ta=parseInt(tip.away),rh=parseInt(res.home),ra=parseInt(res.away);
  if ([th,ta,rh,ra].some(isNaN)) return 0;
  if (th===rh && ta===ra) return 3;
  if ((th>ta&&rh>ra)||(th<ta&&rh<ra)||(th===ta&&rh===ra)) return 1;
  return 0;
}
function defaultGroup() {
  const now = new Date();
  const up = ALL_MATCHES.filter(m => m.group && matchDT(m) >= now);
  return up.length ? up[0].group : "A";
}
function el(tag, cls, ...children) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  children.forEach(c => { if (c != null) e.append(typeof c === "string" ? c : c); });
  return e;
}
function div(cls, ...c) { return el("div", cls, ...c); }
function btn(cls, txt, onClick) {
  const b = el("button", cls, txt);
  b.onclick = onClick;
  return b;
}

// ─── FIREBASE OPS ────────────────────────────────────────────────────────────
function showSaveStatus(msg, dur=2000) {
  const el = document.getElementById("save-status");
  if (el) { el.textContent = msg; setTimeout(() => { if(el) el.textContent=""; }, dur); }
}

async function saveTips() {
  if (!myName) return;
  try {
    await set(ref(db, `players/${safeKey(myName)}`), { name: myName, tips: allData[myName]?.tips || {} });
    showSaveStatus("✓");
  } catch(e) { showSaveStatus("⚠ Feil!", 4000); }
}

async function saveResult(matchId, home, away) {
  try {
    await set(ref(db, `results/${matchId}`), { home, away });
    showSaveStatus("✓");
  } catch(e) { showSaveStatus("⚠ Feil!", 4000); }
}

async function clearResult(matchId) {
  const { remove } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js");
  try {
    await remove(ref(db, `results/${matchId}`));
    delete results[matchId];
    showSaveStatus("✓ Slettet");
    render();
  } catch(e) { showSaveStatus("⚠ Feil!", 4000); }
}

async function deletePlayer(name) {
  if (!confirm(`Slett spilleren "${name}"? Dette kan ikke angres.`)) return;
  const { remove } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js");
  try {
    await remove(ref(db, `players/${safeKey(name)}`));
    delete allData[name];
    if (name === myName) { myName=""; localStorage.removeItem("vmProfetName"); }
    showSaveStatus("✓ Slettet");
    render();
  } catch(e) { showSaveStatus("⚠ Feil!", 4000); }
}

function safeKey(name) { return name.replace(/[.#$/[\]]/g, "_"); }

// ─── LIVE LISTENER ───────────────────────────────────────────────────────────
function startListeners() {
  onValue(ref(db, "players"), snap => {
    const data = snap.val() || {};
    allData = {};
    Object.values(data).forEach(p => { if(p.name) allData[p.name] = { tips: p.tips || {} }; });
    render();
  });
  onValue(ref(db, "results"), snap => {
    results = snap.val() || {};
    render();
  });
}

// ─── POENG ───────────────────────────────────────────────────────────────────
function getScore(name) {
  return Object.entries(allData[name]?.tips||{}).reduce((s,[mid,tip])=>s+calcPts(tip,results[mid]),0);
}
function getStats(name) {
  let exact=0,correct=0,missed=0,tipCount=0;
  Object.entries(allData[name]?.tips||{}).forEach(([mid,tip])=>{
    if(tip?.home!==undefined && tip?.away!==undefined) tipCount++;
    if(!results[mid]) return;
    const p=calcPts(tip,results[mid]);
    if(p===3)exact++; else if(p===1)correct++; else missed++;
  });
  return {exact,correct,missed,tipCount};
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if (!myName) { app.innerHTML=""; app.appendChild(renderLogin()); return; }
  app.innerHTML="";
  app.appendChild(renderHeader());
  const content = div("content");

  if (activeStage === "__leaderboard__") {
    content.appendChild(renderLeaderboard());
  } else if (activeStage === "__results__") {
    content.appendChild(renderResults());
  } else {
    content.appendChild(renderTips());
  }
  app.appendChild(content);
}

function renderLogin() {
  const wrap = div("login-wrap");
  wrap.appendChild(div("login-emoji","⚽"));
  const h1 = el("h1","login-title","VM-PROFET 2026"); wrap.appendChild(h1);
  const sub = el("p","login-sub","Tipp alle 104 VM-kamper. Ingen konto, ingen tracking. 🔒"); wrap.appendChild(sub);

  const form = div("login-form");
  const inp = el("input","login-input");
  inp.placeholder="Ditt navn / kallenavn"; inp.type="text"; inp.autocomplete="off";
  inp.addEventListener("keydown", e => { if(e.key==="Enter") doLogin(inp.value); });
  const go = btn("login-btn","→", () => doLogin(inp.value));
  form.append(inp,go); wrap.appendChild(form);

  const players = Object.keys(allData);
  if (players.length > 0) {
    const ep = div("existing-players");
    ep.appendChild(div("existing-label","Allerede med i gjengen:"));
    const chips = div("player-chips");
    players.forEach(p => {
      chips.appendChild(btn("player-chip", p, () => doLogin(p)));
    });
    ep.appendChild(chips); wrap.appendChild(ep);
  }

  wrap.appendChild(div("login-note","Alle i gjengen bruker samme link. Tips er skjult frem til kampstart."));
  setTimeout(()=>{ const i=document.querySelector(".login-input"); if(i) i.focus(); },50);
  return wrap;
}

function doLogin(name) {
  name = name.trim();
  if (!name) return;
  myName = name;
  localStorage.setItem("vmProfetName", name);
  if (!allData[name]) { allData[name]={tips:{}}; saveTips(); }
  render();
}

// ─── TIPS-SKJERM ─────────────────────────────────────────────────────────────
function renderTips() {
  const wrap = div("");

  // Dagens kamper
  const todayStr = new Date().toISOString().slice(0,10);
  const todayMatches = ALL_MATCHES.filter(m=>m.date===todayStr);
  if (todayMatches.length) {
    const box = div("today-box");
    const dateLabel = new Date().toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"long"});
    box.appendChild(div("today-title",`📅 Kamper i dag — ${dateLabel}`));
    todayMatches.forEach(m => {
      const row = div("today-match");
      row.appendChild(div("today-time", m.time));
      row.appendChild(document.createTextNode(`${FLAGS[m.home]||"🏳"} ${m.home} vs ${m.away} ${FLAGS[m.away]||"🏳"}`));
      if (!isLocked(m)) row.appendChild(div("today-open","⏳ Åpen for tipping →"));
      else if (results[m.id]) row.appendChild(div("today-result",`${results[m.id].home}–${results[m.id].away}`));
      else row.appendChild(div("today-live","🔴 Pågår"));
      row.onclick = () => {
        if (m.group) { activeGroup=m.group; activeStage="Gruppe"; }
        else activeStage=m.stage;
        render();
      };
      box.appendChild(row);
    });
    wrap.appendChild(box);
  }

  // Stage-tabs
  const stageTabs = div("stage-tabs");
  STAGE_ORDER.forEach(s => {
    stageTabs.appendChild(btn("stage-tab"+(activeStage===s?" active":""), s, ()=>{ activeStage=s; render(); }));
  });
  wrap.appendChild(stageTabs);

  if (activeStage === "Gruppe") {
    // Gruppe-tabs
    const groupTabs = div("group-tabs");
    Object.keys(GROUPS).forEach(g => {
      const hasOpen = ALL_MATCHES.filter(m=>m.group===g).some(m=>!isLocked(m));
      const label = g+(g==="I"?" 🇳🇴":"");
      const cls = "group-tab"+(activeGroup===g?" active":"")+(hasOpen?" has-open":"");
      groupTabs.appendChild(btn(cls, label, ()=>{ activeGroup=g; render(); }));
    });
    wrap.appendChild(groupTabs);
    wrap.appendChild(div("group-header",`Gruppe ${activeGroup}: ${GROUPS[activeGroup].map(t=>`${FLAGS[t]||"🏳"} ${t}`).join(" · ")}`));
    ALL_MATCHES.filter(m=>m.group===activeGroup).forEach(m=>wrap.appendChild(renderMatchCard(m)));
  } else {
    ALL_MATCHES.filter(m=>m.stage===activeStage&&!m.group).forEach(m=>wrap.appendChild(renderMatchCard(m)));
  }
  return wrap;
}

// ─── MATCHKORT ───────────────────────────────────────────────────────────────
function renderMatchCard(m) {
  const locked = isLocked(m);
  const res = results[m.id];
  const hasResult = res?.home !== undefined && res?.away !== undefined;
  const myTip = allData[myName]?.tips?.[m.id];
  const myPts = (myTip && hasResult) ? calcPts(myTip, res) : null;
  const myTipComplete = myTip?.home !== undefined && myTip?.away !== undefined;

  const cls = "match-card " + (hasResult?"done":locked?"locked":"open");
  const card = div(cls);

  // Meta
  const meta = div("match-meta");
  meta.appendChild(div("match-date", fmtDate(m)));
  if (m.group) { const b=div("badge badge-group",`Gr. ${m.group}`); meta.appendChild(b); }
  if (!locked) meta.appendChild(div("badge badge-open","⏳ Åpen"));
  else if (!hasResult) meta.appendChild(div("badge badge-live","🔴 Pågår/Venter"));
  else meta.appendChild(div("badge badge-done","✓ Ferdig"));
  card.appendChild(meta);

  // Lag
  const teams = div("match-teams");
  const homeBlock = div("team-block");
  homeBlock.appendChild(div("flag-big", FLAGS[m.home]||"🏳"));
  homeBlock.appendChild(div("team-name", m.home));
  const scoreBlock = div("score-block");
  if (hasResult) scoreBlock.appendChild(div("final-score",`${res.home} – ${res.away}`));
  else scoreBlock.appendChild(div("vs-label","VS"));
  const awayBlock = div("team-block right");
  awayBlock.appendChild(div("flag-big", FLAGS[m.away]||"🏳"));
  awayBlock.appendChild(div("team-name", m.away));
  teams.append(homeBlock, scoreBlock, awayBlock);
  card.appendChild(teams);

  // Tips
  const tipRow = div("tip-row");
  if (!locked) {
    const wrap = div("tip-input-wrap");
    wrap.appendChild(div("tip-label","Mitt tips:"));
    const ih = el("input","score-input"); ih.type="number"; ih.min=0; ih.max=20; ih.placeholder="–";
    ih.value = myTip?.home ?? "";
    ih.oninput = e => { setTip(m.id,"home",e.target.value); };
    wrap.appendChild(ih);
    wrap.appendChild(div("score-dash","–"));
    const ia = el("input","score-input"); ia.type="number"; ia.min=0; ia.max=20; ia.placeholder="–";
    ia.value = myTip?.away ?? "";
    ia.oninput = e => { setTip(m.id,"away",e.target.value); };
    wrap.appendChild(ia);
    if (myTipComplete) wrap.appendChild(el("span","tip-ok","✓"));
    tipRow.appendChild(wrap);
  } else if (myTipComplete) {
    const wrap = div("tip-input-wrap");
    wrap.appendChild(div("tip-label","Mitt tips:"));
    const bg = myPts===3?"#1a5c28":myPts===1?"#4a4200":hasResult?"#5c1a1a":"#1e3a1e";
    const bc = myPts===3?"#3aaa5a":myPts===1?"#aaaa30":hasResult?"#aa3a3a":"#2a5a2a";
    const lt = div("locked-tip",`${myTip.home} – ${myTip.away}`);
    lt.style.cssText=`background:${bg};border-color:${bc}`;
    if (myPts!==null) lt.append(` ${myPts===3?"🎯":myPts===1?"✓":"✗"} ${myPts}p`);
    wrap.appendChild(lt);
    tipRow.appendChild(wrap);
  } else if (locked && !hasResult) {
    tipRow.appendChild(div("not-tipped","⏱ Ikke tippet — kamp er låst"));
  }

  // Admin
  if (adminMode) {
    const ar = div("admin-row");
    ar.appendChild(el("span","admin-label","Resultat:"));
    const ah = el("input","score-input-admin"); ah.type="number"; ah.min=0; ah.max=20; ah.placeholder="H";
    ah.value = res?.home ?? "";
    const aa = el("input","score-input-admin"); aa.type="number"; aa.min=0; aa.max=20; aa.placeholder="B";
    aa.value = res?.away ?? "";
    ar.append(ah, div("score-dash","–"), aa);
    ar.appendChild(btn("admin-save-btn","Lagre", ()=>{
      if (ah.value!==""&&aa.value!=="") {
        results[m.id]={home:ah.value,away:aa.value};
        saveResult(m.id,ah.value,aa.value);
        render();
      }
    }));
    if (hasResult) ar.appendChild(btn("admin-clear-btn","✕ Slett",()=>clearResult(m.id)));
    tipRow.appendChild(ar);
  }
  card.appendChild(tipRow);

  // Andres tips
  const allTips = Object.entries(allData)
    .map(([n,d])=>({name:n,tip:d.tips?.[m.id]}))
    .filter(p=>p.tip?.home!==undefined&&p.tip?.away!==undefined);

  if (allTips.length > 0) {
    const sec = div("others-section");
    const shown = hasResult || revealedMatches[m.id];
    if (!shown) {
      sec.appendChild(btn("reveal-btn",`👁 Vis ${allTips.length} tips (spoiler – kamp ikke spilt)`,()=>{
        revealedMatches[m.id]=true; render();
      }));
    } else {
      const ot = div("other-tips");
      allTips
        .sort((a,b)=>(hasResult?calcPts(b.tip,res):0)-(hasResult?calcPts(a.tip,res):0))
        .forEach(({name,tip})=>{
          const pts = hasResult ? calcPts(tip,res) : null;
          const bg = pts===3?"#1a5c28":pts===1?"#3a3800":pts===0&&hasResult?"#4a1a1a":"#1a2a1a";
          const bc = pts===3?"#3aaa5a":pts===1?"#aaaa40":pts===0&&hasResult?"#aa4a4a":"#2a4a2a";
          const s = el("span","other-tip"+(name===myName?" me":""),`${name}: ${tip.home}–${tip.away}`);
          s.style.cssText=`background:${bg};border-color:${bc}`;
          if (pts!==null) s.append(` ${pts===3?"🎯":pts===1?"✓":"✗"}`);
          ot.appendChild(s);
        });
      sec.appendChild(ot);
    }
    card.appendChild(sec);
  }
  return card;
}

function setTip(matchId, side, val) {
  if (!allData[myName]) allData[myName]={tips:{}};
  if (!allData[myName].tips[matchId]) allData[myName].tips[matchId]={};
  allData[myName].tips[matchId][side] = val;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveTips, 800);
}

// ─── LEADERBOARD ─────────────────────────────────────────────────────────────
function renderLeaderboard() {
  const wrap = div("");
  wrap.appendChild(div("page-title","🏆 Rangliste"));
  const lb = div("leaderboard");
  const players = Object.keys(allData)
    .map(n=>({name:n,pts:getScore(n),...getStats(n)}))
    .sort((a,b)=>b.pts-a.pts||b.tipCount-a.tipCount);

  if (!players.length) { lb.appendChild(div("empty-msg","Ingen spillere enda.")); }
  players.forEach((p,i)=>{
    const row = div("leader-row"+(p.name===myName?" me":""));
    row.appendChild(div("leader-rank", i===0?"🥇":i===1?"🥈":i===2?"🥉":`#${i+1}`));
    const info = div("leader-info");
    info.appendChild(el("span","leader-name",p.name+(p.name===myName?" (deg)":"")));
    const stats = div("leader-stats");
    stats.appendChild(el("span","stat-badge",`🎯 ${p.exact}`));
    stats.appendChild(el("span","stat-badge",`✓ ${p.correct}`));
    stats.appendChild(el("span","stat-badge red",`✗ ${p.missed}`));
    stats.appendChild(el("span","stat-badge",`📝 ${p.tipCount}/104`));
    info.appendChild(stats); row.appendChild(info);
    const pb = div("leader-pts-block");
    pb.appendChild(el("span","leader-pts",String(p.pts)));
    pb.appendChild(el("span","leader-pts-label","poeng"));
    row.appendChild(pb);
    if (adminMode) row.appendChild(btn("delete-btn","🗑",()=>deletePlayer(p.name)));
    lb.appendChild(row);
  });
  wrap.appendChild(lb);
  const pi = div("points-info");
  pi.innerHTML="<span>🎯 Eksakt resultat = <b>3 poeng</b></span><span>✓ Riktig utfall = <b>1 poeng</b></span>";
  wrap.appendChild(pi);
  return wrap;
}

// ─── FASIT ───────────────────────────────────────────────────────────────────
function renderResults() {
  const wrap = div("");
  wrap.appendChild(div("page-title","📊 Fasit & mine tips"));
  let anyResult = false;
  STAGE_ORDER.forEach(stage=>{
    const played = ALL_MATCHES.filter(m=>m.stage===stage&&results[m.id]);
    if (!played.length) return;
    anyResult = true;
    wrap.appendChild(div("stage-label",stage));
    played.forEach(m=>{
      const res=results[m.id], myTip=allData[myName]?.tips?.[m.id];
      const pts=myTip?calcPts(myTip,res):null;
      const row=div("result-row");
      const rt=div("result-teams");
      rt.appendChild(document.createTextNode(`${FLAGS[m.home]||"🏳"} ${m.home} `));
      rt.appendChild(el("span","result-score",`${res.home}–${res.away}`));
      rt.appendChild(document.createTextNode(` ${m.away} ${FLAGS[m.away]||"🏳"}`));
      row.appendChild(rt);
      const rr=div("result-right");
      if (myTip?.home!==undefined) {
        const bg=pts===3?"#1a5c28":pts===1?"#4a4000":"#5c1a1a";
        const tb=div("tip-badge",`${myTip.home}–${myTip.away} ${pts===3?"🎯":pts===1?"✓":"✗"}`);
        tb.style.background=bg; rr.appendChild(tb);
      } else {
        rr.appendChild(el("span","not-tipped","ikke tippet"));
      }
      if (adminMode) rr.appendChild(btn("clear-btn","✕",()=>clearResult(m.id)));
      row.appendChild(rr);
      wrap.appendChild(row);
    });
  });
  if (!anyResult) {
    wrap.appendChild(div("no-results","Ingen resultater registrert enda.<br>Admin registrerer resultater under «Tips»."));
  }
  return wrap;
}

// ─── INIT ────────────────────────────────────────────────────────────────────
startListeners();
</script>
</body>
